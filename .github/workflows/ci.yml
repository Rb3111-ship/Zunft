name: CI

# Runs on every push and pull request: static analysis, and all three test suites.
# The "android-apk" job only runs when started by hand (Actions tab -> CI -> Run workflow).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zunft_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  functions:
    name: Edge Function tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/process-capture/index.ts
      - run: deno test supabase/functions/_shared/

  database:
    name: Database tests (SQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - run: npm ci
      - run: npm test

  android-apk:
    name: Build Android app (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: [app, functions, database]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zunft_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      # SUPABASE_URL and SUPABASE_ANON_KEY are PUBLIC values (the anon/publishable key is meant to
      # be inside the app). Set them under Settings -> Secrets and variables -> Actions -> Variables.
      # Never put the service-role key, GEMINI_API_KEY or DEEPGRAM_API_KEY anywhere near the app.
      - run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: zunft-android-apk
          path: zunft_app/build/app/outputs/flutter-apk/app-release.apk
