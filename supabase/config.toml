# Supabase CLI configuration for Zunft
project_id = "zunft-handwerk"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_role = "anon"

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.captures]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["audio/m4a", "audio/mp4", "audio/aac", "audio/mpeg", "image/jpeg", "image/png"]

[storage.buckets.documents]
public = false
file_size_limit = "20MiB"
allowed_mime_types = ["application/pdf"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[edge_runtime]
enabled = true
port = 54324
inspector_port = 8083

[edge_runtime.secrets]
# Set via environment or .env:
# GEMINI_API_KEY = "..."
# LLM_MODEL = "gemini-2.5-flash-lite"
# DEEPGRAM_API_KEY = "..."
